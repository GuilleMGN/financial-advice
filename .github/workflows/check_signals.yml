name: RSI Signal Check

on:
  schedule:
    # Every hour, 13:00-21:00 UTC, Monday-Friday.
    # This window is intentionally wider than 9:30am-4:00pm ET to cover
    # both EST and EDT without needing two separate schedules - the script
    # itself (check_signals.py) checks the real ET time and no-ops if
    # outside actual market hours.
    - cron: '0 13-21 * * 1-5'
  workflow_dispatch:  # lets you trigger a run manually from the Actions tab, for testing

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy firebase-admin

      - name: Write Firebase service account key from secret
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > service-account-key.json

      - name: Run signal check
        run: python check_signals.py --key service-account-key.json
