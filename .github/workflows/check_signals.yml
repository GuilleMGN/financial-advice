name: RSI Signal Check

on:
  schedule:
    # Every hour, every day. Stocks are filtered out server-side (inside
    # check_signals.py) when outside market hours - crypto tickers are
    # always checked since crypto markets never close.
    - cron: '0 * * * *'
  workflow_dispatch:  # lets you trigger a run manually from the Actions tab, for testing

jobs:
  check-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy firebase-admin

      - name: Write Firebase service account key from secret
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > service-account-key.json

      - name: Run signal check
        run: python check_signals.py --key service-account-key.json
